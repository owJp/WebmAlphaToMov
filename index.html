<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebM Alpha to MOV Converter</title>

    <!-- Enable COOP/COEP Headers dynamically on GitHub Pages -->
    <script src="https://cdn.jsdelivr.net/gh/gzguidoni/coi-serviceworker@1.2.1/coi-serviceworker.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 90%;
            text-align: center;
        }

        h1 { margin-top: 0; font-size: 2.5rem; }

        .drop-zone {
            border: 2px dashed #6366f1;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            background-color: #f8fafc;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .drop-zone:hover, .drop-zone.dragover { 
            background-color: #e0e7ff; 
            border-color: #4f46e5; 
        }

        .drop-zone * {
            pointer-events: none;
        }

        .btn {
            display: none;
            width: 100%;
            padding: 0.85rem;
            margin-top: 1.5rem;
            background-color: #4f46e5;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #4338ca; }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .file-details {
            margin-top: 1.25rem;
            color: #64748b;
            font-size: 0.875rem;
        }

        .error-msg {
            color: #dc2626;
            margin-top: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .status-msg {
            color: #2563eb;
            margin-top: 1rem;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔄</h1>

    <input type="file" id="file-input" style="display: none;" accept=".webm,video/webm">

    <div id="drop-zone" class="drop-zone">
        <span id="drop-label">Drop a WebM file here or click to browse.</span>
    </div>

    <div class="file-details">
        Converts WebM with Alpha channel to Apple ProRes 4444 (MOV).
    </div>

    <button id="convert-btn" class="btn">Convert & Download</button>

    <p id="status-msg" class="status-msg"></p>
    <p id="error-msg" class="error-msg"></p>
</div>

<script type="module">
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm';
    import { fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm';

    document.addEventListener('DOMContentLoaded', () => {
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const dropLabel = document.getElementById('drop-label');
        const convertBtn = document.getElementById('convert-btn');
        const errorMsg = document.getElementById('error-msg');
        const statusMsg = document.getElementById('status-msg');

        let selectedFile = null;
        let ffmpeg = null;

        dropZone.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length > 0) {
                handleFile(dt.files[0]);
            }
        });

        function handleFile(file) {
            if (file && (file.type.includes("webm") || file.name.toLowerCase().endsWith('.webm'))) {
                selectedFile = file;
                dropLabel.textContent = `Selected: ${file.name}`;
                errorMsg.style.display = 'none';
                convertBtn.style.display = 'block';
            } else {
                showError("Please select a valid WebM video file.");
            }
        }

        // Helper function to turn a remote JS file into a local same-origin Blob URL
        async function getBlobURL(url, mimeType) {
            const res = await fetch(url);
            const text = await res.text();
            const blob = new Blob([text], { type: mimeType });
            return URL.createObjectURL(blob);
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            try {
                convertBtn.disabled = true;
                showStatus("Loading converter engine...");

                if (!ffmpeg) {
                    ffmpeg = new FFmpeg();

                    // Download worker script as text and convert it to a local Blob URL on https://owjp.github.io
                    const workerURL = await getBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js', 'text/javascript');
                    const coreURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js';
                    const wasmURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm';

                    await ffmpeg.load({
                        workerURL,
                        coreURL,
                        wasmURL
                    });
                }

                showStatus("Encoding WebM to MOV (ProRes 4444)...");

                const inputName = 'input.webm';
                const outputName = 'output.mov';

                await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

                await ffmpeg.exec([
                    '-i', inputName,
                    '-c:v', 'prores_ks',
                    '-pix_fmt', 'yuva444p10le',
                    outputName
                ]);

                showStatus("Preparing download...");

                const data = await ffmpeg.readFile(outputName);
                const blob = new Blob([data.buffer], { type: 'video/quicktime' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mov";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                showStatus("Done!");
                convertBtn.disabled = false;

            } catch (err) {
                console.error(err);
                showError("Conversion error: " + err.message);
                convertBtn.disabled = false;
                statusMsg.style.display = 'none';
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            statusMsg.style.display = 'none';
        }

        function showStatus(msg) {
            statusMsg.textContent = msg;
            statusMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }
    });
</script>
</body>
</html>
